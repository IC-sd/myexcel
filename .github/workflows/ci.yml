name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: myexcel-platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: myexcel-platform/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Smoke-test local startup
        run: |
          export MYEXCEL_DATA_DIR="$RUNNER_TEMP/myexcel-smoke"
          export MYEXCEL_PORT=18095
          node server/index.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18095/api/health | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
